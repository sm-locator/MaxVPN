services:

  database:
    image: postgres:17

    container_name: maxvpn-db

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:

    build:
      context: ./backend
      args:
        UID: ${APP_UID}
        GID: ${APP_GID}

    container_name: maxvpn-backend



    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - database

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

volumes:
  postgres_data:
