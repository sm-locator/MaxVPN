services:

  database:
    image: postgres:17

    container_name: maxvpn-db

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      args:
        UID: ${APP_UID}
        GID: ${APP_GID}

    container_name: maxvpn-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      SSH_PRIVATE_KEY_PATH: /home/appuser/.ssh/maxvpn_brume3

    depends_on:
      - database

    volumes:
      - /home/max-d/.maxvpn/ssh/maxvpn_brume3:/home/appuser/.ssh/maxvpn_brume3:ro
      - /home/max-d/.maxvpn/ssh/known_hosts:/home/appuser/.ssh/known_hosts:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).read(1)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: maxvpn-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "8080:80"

volumes:
  postgres_data:
